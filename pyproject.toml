[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bus-foundation"
version = "0.3.0"
description = "Unified bus interface for the eCOS stack (split from agora/bus in Phase B, R66). 0.3.0 = R89-R97 modernization: metrics + retry + DLQ admin + property tests + schema registry + OTel + 5-segment cron."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "omostation bus-foundation maintainers" }]
keywords = ["bus", "event", "pubsub", "ecos", "omostation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hypothesis>=6.156.4",
    "pydantic>=2.13.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.0",
    "ruff>=0.5",
    "hypothesis>=6.0",  # R97: property-based testing
]
# Real-WebSocket transport support. The default in-process fanout
# (asyncio.Queue per client) keeps working without these. Install
# `bus-foundation[ws]` only when you want a real `ws://` server bound
# to a port and browser / JS clients connecting.
ws = [
    "websockets>=13.0",
]
# R93: Redis pub/sub for cross-process distributed bus.
redis = [
    "redis>=5.0",
]
# R94: OpenTelemetry tracing (optional, pure-stdlib fallback).
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
zmq = [
    "pyzmq>=27.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/bus_foundation"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
no_implicit_optional = true
warn_unreachable = false
disable_error_code = "type-arg,no-any-return,no-untyped-def,no-untyped-call"
warn_unused_ignores = false
warn_return_any = false

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true
