[build-system]
requires = [
    "hatchling",
]
build-backend = "hatchling.build"

[project]
name = "bus-foundation"
version = "0.3.0"
description = "Unified bus interface for the eCOS stack (split from agora/bus in Phase B, R66). 0.3.0 = R89-R97 modernization: metrics + retry + DLQ admin + property tests + schema registry + OTel + 5-segment cron."
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "omostation bus-foundation maintainers" },
]
keywords = [
    "bus",
    "event",
    "pubsub",
    "ecos",
    "omostation",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "hypothesis>=6.156.4",
    "pydantic>=2.13.4",
]

[project.license]
text = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-benchmark>=5.0",
    "ruff>=0.5",
    "hypothesis>=6.0",
]
ws = [
    "websockets>=13.0",
]
redis = [
    "redis>=5.0",
]
otel = [
    "opentelemetry-api>=1.20",
    "opentelemetry-sdk>=1.20",
]
zmq = [
    "pyzmq>=27.1.0",
]

[tool.hatch.build.targets.wheel]
packages = [
    "src/bus_foundation",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "N",
    "UP",
    "S",
    "PLE",
    "RUF100",
]
ignore = [
    "E402",
    "E501",
    "F401",
    "N813",
    "N817",
    "S101",
    "S104",
    "S105",
    "S108",
    "S110",
    "S112",
    "S310",
    "S311",
    "S314",
    "S603",
    "S607",
    "S608",
    "SIM115",
    "UP047",
]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = [
    "src",
]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
no_implicit_optional = true
warn_unreachable = false
disable_error_code = "type-arg,no-any-return,no-untyped-def,no-untyped-call"
warn_unused_ignores = false
warn_return_any = false

[[tool.mypy.overrides]]
module = [
    "tests.*",
]
ignore_errors = true

[dependency-groups]
dev = [
    "pytest-asyncio>=1.4.0",
]
