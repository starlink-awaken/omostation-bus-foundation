name: benchmark
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
      - name: Run benchmarks
        run: |
          pytest benchmarks/ --benchmark-only --benchmark-json output.json
      - name: Compare with baseline
        run: |
          python3 -c "
          import json, sys
          with open('output.json') as f:
              data = json.load(f)
          baseline = data.get('benchmarks', [])
          for b in baseline:
              name = b['fullname']
              mean = b['stats']['mean']
              print(f'{name}: {mean*1000:.2f}ms')
          "
